# FraudLens local stack, designed for an 8 GB laptop (Docker capped at 3 GB via .wslconfig).
# Profiles start only what each phase needs:
#   docker compose --profile data up -d        # Phase 1-2: postgres
#   docker compose --profile train up -d       # Phase 4, 6: postgres + mlflow
#   docker compose --profile serve up -d       # Phase 8: mlflow + api + dashboard
#   docker compose --profile monitoring up -d  # Phase 9: api + prometheus + grafana
#   docker compose --profile "*" down           # stop everything (plain `down` skips profiles)
# Credentials come from .env (copy .env.example). Services without a profile never start.

name: fraudlens

services:
  postgres:
    image: postgres:16
    profiles: ["data", "train"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - timezone=UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    shm_size: 256mb
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1  # keep in step with the mlflow version in uv.lock
    profiles: ["train", "serve"]
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1                     # default is 4; too much for a 512 MB limit
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      # MLflow 3.x validates the Host header; allow the host machine and the compose network.
      - --allowed-hosts=localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow:/mlflow
    environment:
      # MLflow 3.x starts a job runner plus 7 worker processes (~225 MB each) for its GenAI
      # features; this project does not use them, and they exceed any small memory limit.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    mem_limit: 768m  # ~400 MB at rest; headroom for artifact uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api: &api
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: fraudlens-api:local
    profiles: ["serve"]
    env_file:   # GOOGLE_API_KEY, GEMINI_MODEL, FRAUD_THRESHOLD (secrets stay out of the image)
      - path: .env
        required: false
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000   # overrides the host value from .env
      MODEL_SOURCE: mlflow                      # the @champion from the MLflow registry
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed:ro   # card state snapshot + demo transactions
    depends_on:
      mlflow:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  # Same image and settings, for the monitoring profile: MLflow is not running, so the model is
  # loaded from the export in ./models (`fraudlens export-model`). The network alias keeps the
  # address `api:8000` that Prometheus scrapes.
  api-monitoring:
    <<: *api
    profiles: ["monitoring"]
    environment:
      MODEL_SOURCE: local
    depends_on: {}
    networks:
      default:
        aliases: [api]

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    image: fraudlens-dashboard:local
    profiles: ["serve"]
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    depends_on:
      - api-monitoring
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.10
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Local, read-only viewing without a login (ports bind to 127.0.0.1 only). Phase 12
      # restricts Grafana to the owner's IP when it runs on AWS.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/fraudlens.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro   # datasource + dashboard
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata:
  mlflow:
  prometheus:
  grafana:
